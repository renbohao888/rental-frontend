# Railway 部署配置（Nixpacks）
# 构建：npm run build（Vite 生产构建，自动读取 .env.production）
# 启动：vite preview 静态托管 dist 目录，固定监听 8080（Networking Target Port 填 8080）
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run preview -- --host 0.0.0.0 --port 8080"

